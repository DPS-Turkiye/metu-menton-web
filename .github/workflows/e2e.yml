name: E2E

# Browser tests against a real stack: metu-menton-backend main (compose) + this app's production build.
# Not a required check yet. The repository is public, so a failed run uploads screenshots and the HTML report
# only (no traces or videos), and every value the stack uses is generated per run or fake.
#
# Every PR runs it (docs-only changes aside), always against backend main: a web PR whose backend half is not merged
# yet can fail here for that reason alone. Run it by hand with backend_ref set to test against that branch first.
on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  schedule:
    - cron: "30 1 * * *" # 04:30 in Istanbul
  workflow_dispatch:
    inputs:
      backend_ref:
        description: "metu-menton-backend branch, tag or SHA to test against"
        required: false
        default: main

permissions:
  contents: read

concurrency:
  # A hand-run against another backend_ref does not cancel the branch's own run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.backend_ref || 'main' }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout the backend
        uses: actions/checkout@v5
        with:
          repository: DPS-Turkiye/metu-menton-backend
          ref: ${{ inputs.backend_ref || 'main' }}
          path: .e2e-backend
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start the backend
        run: e2e/stack.sh up
        env:
          E2E_BACKEND_DIR: ${{ github.workspace }}/.e2e-backend

      - name: Build the web app
        run: |
          set -a
          . e2e/.stack/web.env
          set +a
          npm run build

      - name: Run the tests
        run: |
          set -a
          . e2e/.stack/web.env
          set +a
          npm run e2e -- --project=gates

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/**/*.png
          retention-days: 7

      - name: Stop the backend
        if: always()
        run: e2e/stack.sh down
        env:
          E2E_BACKEND_DIR: ${{ github.workspace }}/.e2e-backend

  # The journeys sign in with the dev persona login, which needs a Firebase *test* project. Until its secrets are
  # set on this repository, the job says so and skips; it never falls back to another project.
  e2e-flows:
    runs-on: ubuntu-latest

    timeout-minutes: 40

    # The service-account key is an env var of only the two steps that need it, never of npm ci, the build or the
    # tests (it is on disk in the owner-only e2e/.stack/backend.env while the stack runs; see docs/testing.md).
    env:
      E2E_MODE: flows
      E2E_FIREBASE_API_KEY: ${{ vars.E2E_FIREBASE_API_KEY }}
      E2E_FIREBASE_AUTH_DOMAIN: ${{ vars.E2E_FIREBASE_AUTH_DOMAIN }}
      E2E_FIREBASE_PROJECT_ID: ${{ vars.E2E_FIREBASE_PROJECT_ID }}
      E2E_FIREBASE_APP_ID: ${{ vars.E2E_FIREBASE_APP_ID }}

    steps:
      - name: Check for the Firebase test project
        id: firebase
        env:
          E2E_FIREBASE_CREDENTIALS_JSON: ${{ secrets.E2E_FIREBASE_CREDENTIALS_JSON }}
          # A fork's PR never gets the secret; say so instead of looking like a missing setup.
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$FORK" = true ]; then
            echo "::notice::E2E flows skipped: a pull request from a fork gets no Firebase test project."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$E2E_FIREBASE_CREDENTIALS_JSON" ] && [ -n "$E2E_FIREBASE_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::E2E flows skipped: E2E_FIREBASE_CREDENTIALS_JSON and the E2E_FIREBASE_* variables are not set."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.firebase.outputs.ready == 'true'
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout the backend
        if: steps.firebase.outputs.ready == 'true'
        uses: actions/checkout@v5
        with:
          repository: DPS-Turkiye/metu-menton-backend
          ref: ${{ inputs.backend_ref || 'main' }}
          path: .e2e-backend
          persist-credentials: false

      - name: Setup Node
        if: steps.firebase.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.firebase.outputs.ready == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.firebase.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - name: Start the backend
        if: steps.firebase.outputs.ready == 'true'
        run: |
          # Mask what the secret's own masking misses: each line of the private key (the stack re-emits the JSON
          # compacted) and the staff passwords derived from it. The runner consumes ::add-mask:: lines; they never show.
          python3 -c 'import json,os
          for line in json.loads(os.environ["E2E_FIREBASE_CREDENTIALS_JSON"])["private_key"].splitlines():
              if len(line) > 8: print("::add-mask::" + line)'
          e2e/stack.sh up
          grep -E '^E2E_(ADMIN|COORDINATOR)_PASSWORD=' e2e/.stack/web.env | cut -d= -f2- | sed 's/^/::add-mask::/'
        env:
          E2E_BACKEND_DIR: ${{ github.workspace }}/.e2e-backend
          E2E_FIREBASE_CREDENTIALS_JSON: ${{ secrets.E2E_FIREBASE_CREDENTIALS_JSON }}

      - name: Build the web app
        if: steps.firebase.outputs.ready == 'true'
        run: |
          set -a
          . e2e/.stack/web.env
          set +a
          npm run build

      - name: Run the journeys
        if: steps.firebase.outputs.ready == 'true'
        run: |
          set -a
          . e2e/.stack/web.env
          set +a
          npm run e2e -- --project=flows

      - name: Upload the report
        if: failure() && steps.firebase.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-flows-report
          path: |
            playwright-report/
            test-results/**/*.png
          retention-days: 7

      # What the backend said when a journey failed: error lines and the app's own stack frames, cut short. The key
      # and the staff passwords are masked (Start the backend); lines naming the key are dropped as well.
      - name: Backend errors
        if: failure() && steps.firebase.outputs.ready == 'true'
        run: |
          docker logs metu-e2e-app-1 2>&1 \
            | grep -E "ERROR|Exception|^\s+at com\.dps\." \
            | grep -viE "private_key|BEGIN PRIVATE|credential|FIREBASE_" \
            | cut -c1-300 | head -150 || true

      - name: Stop the backend
        if: always() && steps.firebase.outputs.ready == 'true'
        run: e2e/stack.sh down
        env:
          E2E_BACKEND_DIR: ${{ github.workspace }}/.e2e-backend
